<style>
:root{
  --navy:#16337A;
  --navy-dark:#0F2557;
  --orange:#E07B1A;
  --orange-dark:#C4650A;
  --bg:#33363B;
  --card:#FFFFFF;
  --text:#1C2333;
  --muted:#697089;
  --border:#1A1A1A;
  --green:#1E8E5A;
  --green-dark:#0F3D24;
  --red:#C0392B;
  --radius:12px;
}
*{box-sizing:border-box;}
body{margin:0;font-family:'Segoe UI',Arial,sans-serif;background:var(--bg);color:var(--text);}
h1,h2,h3{font-family:'Segoe UI',Arial,sans-serif;margin:0 0 8px;}
button{font-family:inherit;cursor:pointer;border:2px solid #D4AF37;border-radius:8px;padding:10px 16px;font-weight:600;font-size:14px;}
input,select,textarea{font-family:inherit;padding:9px 11px;border:1px solid var(--border);border-radius:8px;font-size:14px;width:100%;background:#fff;color:var(--text);font-weight:700;}
input:focus,select:focus,textarea:focus{outline:2px solid var(--orange);border-color:var(--orange);}
label{font-size:13px;font-weight:600;color:var(--muted);display:block;margin-bottom:4px;}
.options-page label{color:#D8C9A3;}
.add-user-card label{color:var(--navy-dark);font-weight:800;}
.field{margin-bottom:14px;}
.btn-primary{background:var(--orange);color:#fff;}
.btn-primary:hover{background:var(--orange-dark);}
.btn-secondary{background:var(--navy);color:#fff;}
.btn-secondary:hover{background:var(--navy-dark);}
.btn-outline{background:#fff;color:var(--navy);border:2px solid #D4AF37;}
.btn-danger{background:var(--red);color:#fff;}
.btn-ghost{background:transparent;color:var(--muted);}
.card{background:var(--card);border-radius:var(--radius);padding:20px;box-shadow:0 1px 3px rgba(20,30,60,.08);border:1px solid var(--border);}
.row{display:flex;gap:14px;flex-wrap:wrap;}
.row>.field{flex:1;min-width:200px;}
.hidden{display:none !important;}

/* ---------- LOGIN ---------- */
#loginScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--navy) 0%,var(--navy-dark) 100%);padding:20px;}
.login-box{background:#fff;border-radius:16px;padding:36px 32px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.3);text-align:center;}
.login-box img{width:96px;height:96px;object-fit:contain;margin-bottom:10px;}
.login-box h1{color:var(--navy);font-size:22px;}
.login-box p{color:var(--muted);font-size:13px;margin-bottom:22px;}
#loginError{color:var(--red);font-size:13px;margin-top:10px;min-height:16px;}
.login-box button{width:100%;margin-top:8px;padding:12px;font-size:15px;}

/* ---------- LOCK SCREEN ---------- */
#lockScreen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--navy-dark);color:#fff;text-align:center;padding:30px;}
#lockScreen .box{max-width:420px;}
#lockScreen h2{color:var(--orange);}

/* ---------- APP LAYOUT ---------- */
#app{display:none;min-height:100vh;}
#sidebar{position:fixed;top:0;left:0;bottom:0;width:250px;background:var(--navy-dark);color:#fff;display:flex;flex-direction:column;z-index:50;transition:transform .25s;}
#sidebar .brand{display:flex;align-items:center;gap:10px;padding:20px 18px;border-bottom:1px solid rgba(255,255,255,.1);}
#sidebar .brand img{width:38px;height:38px;object-fit:contain;}
#sidebar .brand div{font-weight:700;font-size:15px;line-height:1.2;}
#sidebar nav{flex:1;overflow-y:auto;padding:10px;}
#sidebar nav a{display:flex;align-items:center;gap:10px;padding:12px 14px;color:#C7D0EA;text-decoration:none;border-radius:8px;font-size:14px;font-weight:600;margin-bottom:4px;}
#sidebar nav a:hover{background:rgba(255,255,255,.06);color:#fff;}
#sidebar nav a.active{background:var(--orange);color:#fff;}
#sidebar .userbox{padding:16px 18px;border-top:1px solid rgba(255,255,255,.1);font-size:13px;}
#sidebar .userbox .role{color:var(--orange);font-weight:700;text-transform:uppercase;font-size:11px;letter-spacing:.5px;}
#sidebar .userbox button{width:100%;margin-top:10px;background:rgba(255,255,255,.08);color:#fff;padding:8px;font-size:13px;}
#main{margin-left:250px;padding:26px 30px;}
#topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
#topbar h1{font-size:22px;color:#fff;}
table{background:#fff;}
#menuToggle{display:none;background:var(--navy);color:#fff;padding:8px 12px;}
@media(max-width:900px){
  #sidebar{transform:translateX(-100%);}
  #sidebar.open{transform:translateX(0);}
  #main{margin-left:0;padding:18px;}
  #menuToggle{display:inline-block;}
}

/* ---------- TABLE ---------- */
table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{background:var(--navy);color:#fff;text-align:left;padding:10px;position:sticky;top:0;}
td{padding:9px 10px;border-bottom:1px solid var(--border);}
tr:hover td{background:#F8FAFF;}
.table-wrap{overflow-x:auto;border-radius:10px;border:1px solid var(--border);}
.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;}
.badge-green{background:#E4F6EC;color:var(--green);}
.badge-red{background:#FCE9E7;color:var(--red);}
.badge-orange{background:#FDF0E1;color:var(--orange-dark);}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
.toolbar input,.toolbar select{width:auto;min-width:160px;}
.tabs{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.tab-btn{background:#fff;border:1px solid var(--border);color:var(--muted);padding:9px 18px;border-radius:8px;font-weight:700;}
.tab-btn.active{background:var(--navy);color:#fff;border-color:var(--navy);}

/* ---------- MODAL ---------- */
.modal-overlay{position:fixed;inset:0;background:rgba(15,20,40,.55);display:flex;align-items:flex-start;justify-content:center;z-index:200;padding:30px 14px;overflow-y:auto;}
.modal{background:#fff;border-radius:14px;width:100%;max-width:760px;padding:26px;margin:auto;}
.modal h2{color:var(--navy-dark);margin-bottom:18px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;border-top:1px solid var(--border);padding-top:16px;}
.section-title{font-size:14px;font-weight:800;color:var(--orange-dark);text-transform:uppercase;letter-spacing:.4px;margin:22px 0 10px;border-bottom:2px solid var(--orange);display:inline-block;padding-bottom:4px;}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px;}
.stat-card{background:#fff;border-radius:12px;padding:18px;border-left:5px solid var(--orange);box-shadow:0 1px 3px rgba(20,30,60,.08);}
.stat-card .label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;}
.stat-card .value{font-size:24px;font-weight:800;color:var(--navy-dark);margin-top:4px;}
.alert-box{background:#FDF0E1;border:1px solid var(--orange);border-radius:10px;padding:14px 16px;margin-bottom:16px;color:var(--orange-dark);font-size:13.5px;}
.file-thumb{width:60px;height:60px;object-fit:cover;border-radius:8px;border:1px solid var(--border);}
.toast{position:fixed;bottom:24px;right:24px;background:var(--navy-dark);color:#fff;padding:14px 20px;border-radius:10px;font-size:14px;z-index:500;box-shadow:0 6px 20px rgba(0,0,0,.25);}
.spinner{border:3px solid #eee;border-top:3px solid var(--orange);border-radius:50%;width:22px;height:22px;animation:spin 0.8s linear infinite;margin:20px auto;}
@keyframes spin{to{transform:rotate(360deg);}}
</style>
</head>

let CURRENT_USER = null; // {nom, role}

/* ================= UTIL ================= */
function toast(msg){
  const t=document.createElement("div");
  t.className="toast";
  t.textContent=msg;
  document.body.appendChild(t);
  setTimeout(()=>t.remove(),3000);
}
function fmtMoney(n){
  n = Math.round(Number(n||0));
  const parts = n.toString().split('');
  let out='';
  let count=0;
  for(let i=parts.length-1;i>=0;i--){
    out = parts[i]+out;
    count++;
    if(count%3===0 && i!==0) out = '.'+out;
  }
  return out + " FCFA";
}
function fmtDate(d){
  if(!d) return '—';
  // Accepte YYYY-MM-DD ou YYYY-MM (mois)
  const parts = String(d).split('-');
  if(parts.length===3){
    return `${parts[2]}/${parts[1]}/${parts[0]}`;
  }
  if(parts.length===2){
    return `${parts[1]}/${parts[0]}`;
  }
  return d;
}
function uid(){ return Math.random().toString(36).slice(2,10); }
async function uploadFile(file, folder){
  if(!file) return null;
  const path = folder+"/"+Date.now()+"_"+uid()+"_"+file.name.replace(/[^a-zA-Z0-9.\-_]/g,"_");
  const {error} = await sb.storage.from(BUCKET).upload(path, file);
  if(error){ toast("Erreur envoi fichier: "+error.message); return null; }
  const {data} = sb.storage.from(BUCKET).getPublicUrl(path);
  return data.publicUrl;
}

/* ================= LOGIN ================= */
async function doLogin(){
  const nom = document.getElementById('loginNom').value.trim();
  const pass = document.getElementById('loginPass').value;
  const errEl = document.getElementById('loginError');
  errEl.textContent = "";
  if(!nom||!pass){ errEl.textContent="Veuillez remplir tous les champs."; return; }
  const {data,error} = await sb.from('utilisateurs').select('*').ilike('nom_utilisateur',nom).eq('mot_de_passe',pass).maybeSingle();
  if(error || !data){ errEl.textContent="Identifiants incorrects."; return; }
  CURRENT_USER = {nom:data.nom, role:data.role};
  sessionStorage.setItem('gjm_user', JSON.stringify(CURRENT_USER));
  await loadParamsAndEnter();
}
async function loadParamsAndEnter(){
  const {data} = await sb.from('parametres_generales').select('*').eq('id',1).maybeSingle();
  PARAMS = data;
  applyBranding();
  // Si la période d'utilisation n'a jamais été définie, seul le créateur peut se connecter
  if(CURRENT_USER.role!=='createur' && (!PARAMS || !PARAMS.periode_fin)){
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('app').style.display='none';
    document.getElementById('lockScreen').classList.remove('hidden');
    document.getElementById('lockTitle').textContent = '⛔ Application non configurée';
    document.getElementById('lockMsg1').textContent = "Le créateur de l'application n'a pas encore défini la période d'utilisation.";
    document.getElementById('lockMsg2').textContent = "Veuillez contacter Jean Marc (créateur) pour activer l'accès.";
    return;
  }
  // Vérification période d'utilisation (le créateur n'est jamais bloqué)
  if(PARAMS && PARAMS.periode_fin && CURRENT_USER.role!=='createur'){
    const today = new Date().toISOString().slice(0,10);
    if(today > PARAMS.periode_fin){
      document.getElementById('loginScreen').style.display='none';
      document.getElementById('app').style.display='none';
      document.getElementById('lockScreen').classList.remove('hidden');
      return;
    }
  }
  document.getElementById('loginScreen').style.display='none';
  document.getElementById('app').style.display='block';
  document.getElementById('userName').textContent = CURRENT_USER.nom;
  document.getElementById('userRole').textContent = CURRENT_USER.role;
  buildNav();
  goTo('accueil');
  setupRealtime();
}
const REALTIME_TABLES = ['locataires','locaux','paiements','paiements_arrieres','depenses','cours','types_maison','adresses_locaux','utilisateurs','parametres_generales'];
let _realtimeChannel = null;
let _lastUserAction = 0;
document.addEventListener('click', ()=>{ _lastUserAction = Date.now(); }, true);
function setupRealtime(){
  if(_realtimeChannel) return;
  let debounceTimer = null;
  _realtimeChannel = sb.channel('gjm_realtime_channel');
  REALTIME_TABLES.forEach(t=>{
    _realtimeChannel.on('postgres_changes', {event:'*', schema:'public', table:t}, ()=>{
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(rafraichirPageActuelle, 900);
    });
  });
  _realtimeChannel.subscribe();
}
function rafraichirPageActuelle(){
  // Ne pas rafraîchir si un formulaire/modal est ouvert, pour ne pas interrompre la saisie
  if(document.getElementById('modalOverlay')) return;
  // Ne pas re-rafraîchir juste après une action locale (déjà rafraîchi manuellement) pour éviter le clignotement
  if(Date.now() - _lastUserAction < 1600) return;
  const fn = {accueil:renderAccueil, locataires:renderLocataires, dossiers:renderDossiers, locaux:renderLocaux, paiements:renderPaiements, comptabilite:renderComptabilite, options:renderOptions}[CURRENT_PAGE];
  if(fn) fn();
}
function applyBranding(){
  if(!PARAMS) return;
  let logoUrl = null;
  if(PARAMS.mode==='entreprise') logoUrl = PARAMS.ent_logo_url;
  if(logoUrl){
    document.getElementById('loginLogo').src = logoUrl;
    document.getElementById('loginLogo').classList.remove('hidden');
    document.getElementById('sideLogo').src = logoUrl;
    document.getElementById('sideLogo').classList.remove('hidden');
  }
}
function logout(){
  sessionStorage.removeItem('gjm_user');
  CURRENT_USER=null;
  location.reload();
}

/* ================= NAV / ROLES ================= */
const MENU = [
  {id:'accueil', label:'🏠 Accueil', roles:['createur','administrateur','tresorier','secretaire']},
  {id:'locataires', label:'👤 Identification des locataires', roles:['createur','administrateur','tresorier','secretaire']},
  {id:'locaux', label:'🏘️ Identification des locaux liés aux locataires', roles:['createur','administrateur','tresorier','secretaire']},
  {id:'dossiers', label:'🗂️ Dossiers locataires', roles:['createur','administrateur','tresorier','secretaire']},
  {id:'paiements', label:'💵 Paiement de loyer', roles:['createur','administrateur','tresorier']},
  {id:'comptabilite', label:'📊 Comptabilité', roles:['createur','administrateur','tresorier']},
  {id:'options', label:'⚙️ Option', roles:['createur','administrateur']},
];
function buildNav(){
  const nav = document.getElementById('navLinks');
  nav.innerHTML="";
  MENU.forEach(m=>{
    if(!m.roles.includes(CURRENT_USER.role)) return;
    const a = document.createElement('a');
    a.href="#"; a.textContent=m.label; a.dataset.id=m.id;
    a.onclick=(e)=>{e.preventDefault(); goTo(m.id); document.getElementById('sidebar').classList.remove('open');};
    nav.appendChild(a);
  });
}
async function goTo(id){
  CURRENT_PAGE=id;
  document.querySelectorAll('#navLinks a').forEach(a=>a.classList.toggle('active', a.dataset.id===id));
  const titles={accueil:'Accueil',locataires:'Identification des locataires',dossiers:'Dossiers locataires',locaux:'Identification des locaux liés aux locataires',paiements:'Paiement de loyer',comptabilite:'Comptabilité',options:'Option'};
  document.getElementById('pageTitle').textContent = titles[id]||'';
  const fn = {accueil:renderAccueil, locataires:renderLocataires, dossiers:renderDossiers, locaux:renderLocaux, paiements:renderPaiements, comptabilite:renderComptabilite, options:renderOptions}[id];
  if(fn) await fn();
}

<!-- Les modules applicatifs (Accueil, Locataires, Locaux, Paiements, Comptabilité, Options) seront ajoutés ci-dessous -->
<script>
/* ============================================================
   GJM IMMOBILIER - MODULES
   ============================================================ */

const TYPES_PIECE = ['CNI','ATT','PP','PC','CR','Autres'];
const FORMES_JURIDIQUES = ['SARL','SA','SAS','Entrepreneur individuel',"Statut d'Entreprenant",'SNC','SCS','Autres'];

function slugify(str){
  return (str||'sans_nom').toString().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-zA-Z0-9]+/g,'_').replace(/^_+|_+$/g,'').toLowerCase() || 'sans_nom';
}
function previewFile(inputEl, previewId){
  const box = document.getElementById(previewId);
  if(!box) return;
  const file = inputEl.files[0];
  if(!file){ box.innerHTML=''; return; }
  if(file.type.startsWith('image/')){
    const url = URL.createObjectURL(file);
    box.innerHTML = `<img src="${url}" class="file-thumb" style="margin-top:6px;">`;
  } else {
    box.innerHTML = `<span style="font-size:12px;color:var(--muted);">📄 ${file.name}</span>`;
  }
}
function previewFiles(inputEl, previewId){
  const box = document.getElementById(previewId);
  if(!box) return;
  const files = inputEl.files;
  if(!files || !files.length){ box.innerHTML=''; return; }
  let html='';
  for(const file of files){
    if(file.type.startsWith('image/')){
      const url = URL.createObjectURL(file);
      html += `<img src="${url}" class="file-thumb" style="margin:4px 4px 0 0;">`;
    } else {
      html += `<div style="font-size:12px;color:var(--muted);">📄 ${file.name}</div>`;
    }
  }
  box.innerHTML = html;
}

function voirDetailArriere(localId){
  const x = (window._situationArrieresCache||[]).find(a=>a.localId===localId);
  if(!x) return;
  openModal(`
    <h2>Détail de l'arriéré</h2>
    <p><b>Locataire :</b> ${x.nom}</p>
    <p><b>Cour :</b> ${x.cour||'—'}</p>
    <p><b>Type de maison :</b> ${x.typ||'—'}</p>
    <p><b>Montant du loyer :</b> ${fmtMoney(x.prixLoyer)}</p>
    <p><b>Mois impayés :</b> ${x.moisImpayes.join(', ')||'—'}</p>
    <p><b>Arriéré actuel :</b> <span style="color:var(--red);font-weight:900;font-size:18px;">${fmtMoney(x.solde)}</span></p>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">Fermer</button>
      <button class="btn-primary" onclick="ouvrirFormPayerArriere('${localId}')">💰 Payer les arriérés</button>
    </div>
  `);
}
function ouvrirFormPayerArriere(localId){
  const x = (window._situationArrieresCache||[]).find(a=>a.localId===localId);
  if(!x) return;
  openModal(`
    <h2>Payer les arriérés — ${x.nom}</h2>
    <div class="row">
      <div class="field"><label>Nom et prénom du locataire</label><input value="${x.nom}" readonly></div>
      <div class="field"><label>Cour</label><input value="${x.cour||'—'}" readonly></div>
      <div class="field"><label>Type de maison</label><input value="${x.typ||'—'}" readonly></div>
    </div>
    <div class="row">
      <div class="field"><label>Montant arriéré actuel</label><input id="pa_arriere_actuel" value="${x.solde}" readonly></div>
      <div class="field"><label>Montant à payer</label><input type="number" id="pa_montant_paye" oninput="calcResteArriere(${x.solde})"></div>
      <div class="field"><label>Reste arriéré</label><input type="number" id="pa_reste_arriere" value="${x.solde}" readonly></div>
    </div>
    <div class="field"><label>Mois concerné (parmi les mois impayés)</label>
      <select id="pa_mois">${x.moisImpayesRaw.map(m=>`<option value="${m}">${fmtDate(m)}</option>`).join('') || '<option value="">—</option>'}</select>
    </div>
    <div class="field"><label>Date du paiement</label><input type="date" id="pa_date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn-primary" onclick="enregistrerPaiementArriere('${localId}')">Enregistrer</button>
    </div>
  `);
}
function calcResteArriere(arriereActuel){
  const paye = parseFloat(document.getElementById('pa_montant_paye').value||0);
  document.getElementById('pa_reste_arriere').value = Math.max(0, arriereActuel - paye);
}
async function enregistrerPaiementArriere(localId){
  const x = (window._situationArrieresCache||[]).find(a=>a.localId===localId);
  if(!x) return;
  const montantPaye = parseFloat(document.getElementById('pa_montant_paye').value||0);
  if(!montantPaye || montantPaye<=0){ toast("Veuillez saisir un montant à payer."); return; }
  const resteArriere = Math.max(0, x.solde - montantPaye);
  const {data:loc} = await sb.from('locaux').select('*').eq('id',localId).maybeSingle();
  const rec = {
    locataire_id: loc?loc.locataire_id:null,
    locaux_id: localId,
    date_paiement: document.getElementById('pa_date').value,
    mois_concerne: document.getElementById('pa_mois').value||null,
    montant_arriere_avant: x.solde,
    montant_paye: montantPaye,
    reste_arriere: resteArriere,
    statut: resteArriere<=0 ? 'total' : 'partiel'
  };
  const {error} = await sb.from('paiements_arrieres').insert(rec);
  if(error){ toast("Erreur: "+error.message); return; }
  closeModal();
  toast(resteArriere<=0 ? "Arriéré totalement purgé ✅" : "Paiement partiel de l'arriéré enregistré ⚠️");
  if(CURRENT_PAGE==='accueil') renderAccueil();
  else renderComptabilite();
}

function canEdit(section){
  const r = CURRENT_USER.role;
  if(r==='createur') return true;
  if(r==='administrateur') return section!=='securite' && section!=='periode';
  if(r==='tresorier') return ['accueil','locataires','locaux','paiements','comptabilite'].includes(section);
  if(r==='secretaire') return ['accueil','locataires','locaux'].includes(section);
  return false;
}

function openModal(html){
  document.querySelectorAll('.modal-overlay').forEach(el=>el.remove());
  const ov=document.createElement('div');
  ov.className='modal-overlay';
  ov.id='modalOverlay';
  ov.innerHTML=`<div class="modal">${html}</div>`;
  ov.onclick=(e)=>{ if(e.target===ov) closeModal(); };
  document.body.appendChild(ov);
}
function closeModal(){
  document.querySelectorAll('.modal-overlay').forEach(el=>el.remove());
}

/* ============================================================
   DOSSIERS LOCATAIRES
   ============================================================ */
async function renderDossiers(){
  const c=document.getElementById('content');
  c.innerHTML='<div class="spinner"></div>';
  const {data,error} = await sb.from('locataires').select('*').order('created_at',{ascending:false});
  if(error){ c.innerHTML='Erreur: '+error.message; return; }
  window._locatairesCache = data||[];

  const cards = (data||[]).map(l=>{
    const isHab = l.type_local==='habitation';
    const nom = isHab ? l.h_nom_prenom : l.c_nom_entreprise;
    const nbFichiers = countFichiers(l);
    return `<div class="card" style="cursor:pointer;" onclick="openDossier('${l.id}')">
      <div style="display:flex;align-items:center;gap:12px;">
        <div style="font-size:34px;">🗂️</div>
        <div>
          <div style="font-weight:800;color:var(--navy-dark);">${nom||'Sans nom'}</div>
          <div style="font-size:12px;color:var(--muted);">${isHab?'Habitation':'Commercial'} · ${nbFichiers} fichier(s)</div>
        </div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('content').innerHTML = `
    <p style="color:#D9DDE5;margin-bottom:16px;">Chaque dossier regroupe automatiquement les pièces jointes enregistrées pour un locataire ou une entreprise.</p>
    <div class="stat-grid">${cards || '<p style="color:#D9DDE5">Aucun dossier disponible pour le moment.</p>'}</div>
  `;
}
function countFichiers(l){
  let n=0;
  if(l.type_local==='habitation'){
    if(l.h_piece_id_url) n++;
    if(l.h_photo_url) n++;
    if(l.h_autres_pieces_url) n+=l.h_autres_pieces_url.length;
  } else {
    if(l.c_piece_representant_url) n++;
    if(l.c_photo_representant_url) n++;
    if(l.c_autres_pieces_entreprise_url) n+=l.c_autres_pieces_entreprise_url.length;
  }
  return n;
}
function openDossier(id){
  const l = (window._locatairesCache||[]).find(x=>x.id===id);
  if(!l) return;
  const isHab = l.type_local==='habitation';
  const nom = isHab ? l.h_nom_prenom : l.c_nom_entreprise;
  const fichiers = [];
  if(isHab){
    if(l.h_piece_id_url) fichiers.push({label:"Pièce d'identité", url:l.h_piece_id_url});
    if(l.h_photo_url) fichiers.push({label:"Photo du locataire", url:l.h_photo_url});
    (l.h_autres_pieces_url||[]).forEach((u,i)=>fichiers.push({label:"Autre pièce "+(i+1), url:u}));
  } else {
    if(l.c_piece_representant_url) fichiers.push({label:"Pièce du représentant", url:l.c_piece_representant_url});
    if(l.c_photo_representant_url) fichiers.push({label:"Photo du représentant", url:l.c_photo_representant_url});
    (l.c_autres_pieces_entreprise_url||[]).forEach((u,i)=>fichiers.push({label:"Autre pièce "+(i+1), url:u}));
  }
  const items = fichiers.map(f=>{
    const isImg = /\.(jpe?g|png|gif|webp)$/i.test(f.url);
    return `<div style="display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--border);">
      ${isImg?`<img src="${f.url}" class="file-thumb">`:`<div style="font-size:28px;">📄</div>`}
      <div style="flex:1;">${f.label}</div>
      <a href="${f.url}" target="_blank" class="btn-outline" style="padding:6px 12px;font-size:12px;text-decoration:none;">Ouvrir</a>
    </div>`;
  }).join('') || '<p style="color:var(--muted)">Aucun fichier dans ce dossier.</p>';
  openModal(`<h2>🗂️ Dossier — ${nom}</h2>${items}<div class="modal-actions"><button class="btn-secondary" onclick="closeModal()">Fermer</button></div>`);
}

/* ============================================================
   ACCUEIL
   ============================================================ */
async function renderAccueil(){
  const c=document.getElementById('content');
  c.innerHTML='<div class="spinner"></div>';

  const [{data:locataires},{data:locaux},{data:paiements},{data:paiementsArrieres}] = await Promise.all([
    sb.from('locataires').select('id'),
    sb.from('locaux').select('id,prix,locataire_id'),
    sb.from('paiements').select('*'),
    sb.from('paiements_arrieres').select('*')
  ]);

  const moisActuel = new Date().toISOString().slice(0,7);
  const paiementsMois = (paiements||[]).filter(p=>p.mois_concerne && p.mois_concerne.startsWith(moisActuel));
  const arrieresMois = (paiementsArrieres||[]).filter(p=>p.date_paiement && p.date_paiement.startsWith(moisActuel));
  const totalRecuMois = paiementsMois.reduce((s,p)=>s+Number(p.total_recu||p.montant_recu||0),0) + arrieresMois.reduce((s,p)=>s+Number(p.montant_paye||0),0);
  const locauxOccupes = (locaux||[]).filter(l=>l.locataire_id).length;

  const situationArrieres = await getSituationArrieres();

  const bannerLogo = (PARAMS && PARAMS.mode==='entreprise' && PARAMS.ent_logo_url) ? PARAMS.ent_logo_url : GJM_BRAND_LOGO;
  let welcomeText = `Bienvenue, ${CURRENT_USER.nom}`;
  if(PARAMS && PARAMS.mode==='entreprise' && PARAMS.ent_nom){
    welcomeText = `Bienvenue à l'entreprise ${PARAMS.ent_nom}`;
  } else if(PARAMS && PARAMS.mode!=='entreprise' && PARAMS.proprio_nom){
    welcomeText = `Bienvenue Monsieur/Madame ${PARAMS.proprio_nom}`;
  }
  let html = `<div style="display:flex;align-items:center;gap:16px;margin-bottom:22px;background:var(--green-dark);border-radius:var(--radius);padding:16px 20px;">
      <img src="${bannerLogo}" alt="Logo" style="width:70px;height:70px;object-fit:contain;background:#fff;border-radius:10px;padding:4px;">
      <div><h2 style="color:#fff;margin:0;">${welcomeText}</h2><p style="color:#D9EFE1;margin:4px 0 0;">Voici un aperçu de votre activité immobilière</p></div>
    </div>
    <div class="stat-grid">
    <div class="stat-card"><div class="label">Locataires enregistrés</div><div class="value">${(locataires||[]).length}</div></div>
    <div class="stat-card"><div class="label">Locaux enregistrés</div><div class="value">${(locaux||[]).length}</div></div>
    <div class="stat-card"><div class="label">Locaux occupés</div><div class="value">${locauxOccupes}</div></div>
    <div class="stat-card"><div class="label">Reçu ce mois-ci</div><div class="value">${fmtMoney(totalRecuMois)}</div></div>
  </div>`;

  if(situationArrieres.length){
    html += `<div class="section-title">⚠️ Alertes — locataires en arriéré</div>`;
    situationArrieres.forEach(x=>{
      html += `<div class="alert-box" style="cursor:pointer;" onclick="ouvrirBilanArrierePuisDetail('${x.localId}')">⚠️ <b>${x.nom}</b> — Cour : ${x.cour||'—'} — Type de maison : ${x.typ||'—'} — Mois impayés : ${x.moisImpayes.join(', ')||'—'} — Arriéré actuel : <b>${fmtMoney(x.solde)}</b></div>`;
    });
  } else {
    html += `<div class="section-title">Alertes</div><p style="color:#D9DDE5">Aucun arriéré en cours 👍</p>`;
  }

  c.innerHTML = html;
}
async function ouvrirBilanArrierePuisDetail(localId){
  window._situationArrieresCache = await getSituationArrieres();
  voirDetailArriere(localId);
}

   LOCATAIRES
   ============================================================ */
async function renderLocataires(){
  const c=document.getElementById('content');
  c.innerHTML='<div class="spinner"></div>';
  const {data,error} = await sb.from('locataires').select('*').order('created_at',{ascending:false});

function filterTable(inputId, tableId){
  const q = document.getElementById(inputId).value.toLowerCase();

    tr.style.display = tr.textContent.toLowerCase().includes(q) ? '' : 'none';

function openLocataireForm(existing){
  const l = existing || {};
  const isHab = !existing || l.type_local==='habitation';
  openModal(`
    <h2>${existing?'Modifier':'Nouveau'} locataire</h2>
    <div class="field">
      <label>Type de local</label>
      <select id="f_type_local" onchange="toggleLocataireType()">

function toggleLocataireType(){

function habitationFormHTML(l){
  return `

      <div class="field"><label>Numéro de la pièce</label><input id="h_numero_piece" value="${l.h_numero_piece||''}"></div>

async function saveLocataire(id){
  const type = document.getElementById('f_type_local').value;
  const rec = {type_local:type};
  const g = (i)=>document.getElementById(i)?document.getElementById(i).value:null;
  if(type==='habitation'){
    Object.assign(rec,{
      h_nom_prenom:g('h_nom_prenom'), h_date_naissance:g('h_date_naissance')||null, h_lieu_naissance:g('h_lieu_naissance'),
      h_type_piece:g('h_type_piece'), h_numero_piece:g('h_numero_piece'), h_profession:g('h_profession'),
      h_telephone:g('h_telephone'), h_email:g('h_email'), h_situation_familiale:g('h_situation_familiale'),
      h_nb_enfants:parseInt(g('h_nb_enfants')||0), h_garant_nom_prenom:g('h_garant_nom_prenom'),
      h_garant_type_piece:g('h_garant_type_piece'), h_garant_numero_piece:g('h_garant_numero_piece'),
      h_garant_adresse_contact:g('h_garant_adresse_contact')
    });
    if(!rec.h_nom_prenom){ toast("Le nom et prénom du locataire est requis."); return; }
    const dossier = 'locataires/'+slugify(rec.h_nom_prenom);
    const pieceF = document.getElementById('h_piece_id_file').files[0];
    const photoF = document.getElementById('h_photo_file').files[0];
    const autresF = document.getElementById('h_autres_files').files;
    if(pieceF) rec.h_piece_id_url = await uploadFile(pieceF,dossier);
    if(photoF) rec.h_photo_url = await uploadFile(photoF,dossier);
    if(autresF && autresF.length){
      const urls=[];
      for(const f of autresF){ const u=await uploadFile(f,dossier); if(u) urls.push(u); }
      rec.h_autres_pieces_url = urls;
    }
  } else {
    Object.assign(rec,{
      c_nom_entreprise:g('c_nom_entreprise'), c_forme_juridique:g('c_forme_juridique'), c_rccm:g('c_rccm'),
      c_adresse_siege:g('c_adresse_siege'), c_email_entreprise:g('c_email_entreprise'), c_contact_entreprise:g('c_contact_entreprise'),
      c_description_activite:g('c_description_activite'), c_horaires_ouverture:g('c_horaires_ouverture'),
      c_qualite_representant:g('c_qualite_representant'), c_rep_nom_prenom:g('c_rep_nom_prenom'),
      c_rep_date_naissance:g('c_rep_date_naissance')||null, c_rep_lieu_naissance:g('c_rep_lieu_naissance'),
      c_rep_type_piece:g('c_rep_type_piece'), c_rep_numero_piece:g('c_rep_numero_piece'),
      c_rep_telephone:g('c_rep_telephone'), c_rep_email:g('c_rep_email')
    });
    if(!rec.c_nom_entreprise){ toast("Le nom de l'entreprise est requis."); return; }
    const dossierC = 'locataires/'+slugify(rec.c_nom_entreprise);
    const pieceF = document.getElementById('c_piece_file').files[0];
    const photoF = document.getElementById('c_photo_file').files[0];
    const autresF = document.getElementById('c_autres_files').files;
    if(pieceF) rec.c_piece_representant_url = await uploadFile(pieceF,dossierC);
    if(photoF) rec.c_photo_representant_url = await uploadFile(photoF,dossierC);
    if(autresF && autresF.length){
      const urls=[];
      for(const f of autresF){ const u=await uploadFile(f,dossierC); if(u) urls.push(u); }
      rec.c_autres_pieces_entreprise_url = urls;
    }
  }
  let error;
  if(id){ ({error} = await sb.from('locataires').update(rec).eq('id',id)); }
  else { ({error} = await sb.from('locataires').insert(rec)); }
  if(error){ toast("Erreur: "+error.message); return; }
  closeModal(); toast("Locataire enregistré ✅"); renderLocataires();
}

async function urlToBase64(url){
  try{
    const res = await fetch(url);
    const blob = await res.blob();
    return await new Promise((resolve,reject)=>{
      const reader = new FileReader();
      reader.onloadend = ()=>resolve(reader.result);
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }catch(e){ return null; }
}

  const nom = isHab ? l.h_nom_prenom : l.c_nom_entreprise;

    line('Horaires :', l.c_horaires_ouverture);

    <div class="field"><label>Cour concernée</label>
      <select id="newTypeCourId">${cours.map(c=>`<option value="${c.id}">${c.nom}</option>`).join('') || '<option value="">— Créez d\'abord une cour —</option>'}</select>
    </div>
    <div class="field"><label>Types de maison (un par ligne)</label>
      <textarea id="newTypesMultiple" rows="3" placeholder="Ex: Studio, F2, F3..."></textarea>

          ${sesCours.map(c=>`
            <div style="margin:8px 0 0 16px;padding:8px;border-left:3px solid var(--orange);">

              <ul>${typesParCour(c.id).map(t=>`<li>${t.nom} <button class="btn-ghost" onclick="deleteType('${t.id}')" style="padding:2px 8px">✕</button></li>`).join('') || '<li style="color:var(--muted)">Aucun type de maison</li>'}</ul>

      ${coursSansAdresse.length ? `

          <b>Cours sans adresse associée</b>
          ${coursSansAdresse.map(c=>`
            <div style="margin:8px 0 0 16px;padding:8px;border-left:3px solid var(--orange);">
              <b>${c.nom}</b> — ${c.nombre_portes||0} porte(s)
              <button class="btn-ghost" onclick="deleteCour('${c.id}')" style="padding:2px 8px">✕ Suppr. la cour</button>
              <ul>${typesParCour(c.id).map(t=>`<li>${t.nom} <button class="btn-ghost" onclick="deleteType('${t.id}')" style="padding:2px 8px">✕</button></li>`).join('') || '<li style="color:var(--muted)">Aucun type de maison</li>'}</ul>

function filterCoursResultats(){
  const q = document.getElementById('searchCoursResultats').value.toLowerCase();
  document.querySelectorAll('#coursResultatsList .cour-result-block').forEach(el=>{
    el.style.display = el.dataset.search.includes(q) ? '' : 'none';
  });
}
async function addTypesMultiple(){
  const courId = document.getElementById('newTypeCourId').value;
  const raw = document.getElementById('newTypesMultiple').value;
  const noms = raw.split('\n').map(s=>s.trim()).filter(Boolean);
  if(!courId){ toast("Veuillez d'abord créer et choisir une cour."); return; }
  if(!noms.length){ toast("Veuillez saisir au moins un type de maison."); return; }
  const rows = noms.map(nom=>({nom, cour_id:courId}));
  const {error} = await sb.from('types_maison').insert(rows);
  if(error){ toast("Erreur: "+error.message); return; }
  const {data} = await sb.from('types_maison').select('*');
  window._typesCache = data;
  toast(noms.length+" type(s) de maison ajouté(s) ✅");
  openOptionsListManager();
}
async function addAdresse(){
  const v = document.getElementById('newAdresse').value.trim();
  if(!v) return;
  const {error} = await sb.from('adresses_locaux').insert({adresse:v});
  if(error){ toast("Erreur: "+error.message); return; }
  const {data} = await sb.from('adresses_locaux').select('*');
  window._adressesCache = data;
  openOptionsListManager();
}
async function addCour(){
  const adresseId = document.getElementById('newCourAdresseId').value || null;
  const nom = document.getElementById('newCourNom').value.trim();
  const portes = parseInt(document.getElementById('newCourPortes').value||0);
  if(!nom){ toast("Veuillez saisir le nom de la cour."); return; }
  const {error} = await sb.from('cours').insert({nom, nombre_portes:portes, adresse_id:adresseId});
  if(error){ toast("Erreur: "+error.message); return; }
  const {data} = await sb.from('cours').select('*');
  window._coursCache = data;
  openOptionsListManager();
}
async function deleteCour(id){
  await sb.from('cours').delete().eq('id',id);
  const [{data:cours},{data:types}] = await Promise.all([sb.from('cours').select('*'), sb.from('types_maison').select('*')]);
  window._coursCache=cours; window._typesCache=types;
  openOptionsListManager();
}
async function deleteAdresse(id){ await sb.from('adresses_locaux').delete().eq('id',id); const [{data:adresses},{data:cours}] = await Promise.all([sb.from('adresses_locaux').select('*'), sb.from('cours').select('*')]); window._adressesCache=adresses; window._coursCache=cours; openOptionsListManager(); }
async function deleteType(id){ await sb.from('types_maison').delete().eq('id',id); const {data} = await sb.from('types_maison').select('*'); window._typesCache=data; openOptionsListManager(); }

function openLocalForm(existing){
  const loc = existing||{};
  const adresses = window._adressesCache||[];
  const types = window._typesCache||[];
  const cours = window._coursCache||[];
  const locataires = window._locatairesCache||[];
  const type = loc.type_local||'habitation';

    <h2>${existing?'Modifier':'Nouveau'} local</h2>
    <div class="row">
      <div class="field"><label>Adresse du local</label>
        <select id="l_adresse_id" onchange="refreshCoursByAdresse()"><option value="">— Aucune —</option>${adresses.map(a=>`<option value="${a.id}" ${loc.adresse_id===a.id?'selected':''}>${a.adresse}</option>`).join('')}</select>
      </div>
      <div class="field"><label>Nom de la cour</label>
        <select id="l_cour_id" onchange="refreshTypesByCour()"></select>
      </div>

        <select id="l_type_local" onchange="toggleLocalLocataire()">
          <option value="habitation" ${type==='habitation'?'selected':''}>Habitation</option>

        </select>
      </div>
    </div>

      <div class="field"><label>Type de maison</label>
        <select id="l_type_maison_id"></select>
      </div>
      <div class="field"><label>Prix du local (FCFA)</label><input type="number" id="l_prix" value="${loc.prix||''}"></div>
      <div class="field"><label>Caution perçue (FCFA)</label><input type="number" id="l_caution" value="${loc.caution||''}"></div>
    </div>
    <p style="font-size:12px;color:var(--muted);margin-top:-6px;">ℹ️ La caution est indépendante du paiement de loyer — elle est enregistrée uniquement à titre d'information sur le local. La cour proposée dépend de l'adresse choisie, et le type de maison dépend de la cour choisie.</p>
    <div class="field"><label>Locataire</label><select id="l_locataire_id"></select></div>
    <div id="l_auto_fields" style="font-size:13px;color:var(--muted);margin-top:8px;"></div>
    <div class="modal-actions">
      <button class="btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn-primary" onclick="saveLocal('${existing?existing.id:''}')">Enregistrer</button>
    </div>
  `);
  window._editingLocal = loc;
  refreshCoursByAdresse();
  toggleLocalLocataire();
}
function refreshCoursByAdresse(){
  const adresseId = document.getElementById('l_adresse_id').value;
  const cours = window._coursCache||[];
  const loc = window._editingLocal||{};
  const coursFiltrees = adresseId ? cours.filter(c=>c.adresse_id===adresseId) : cours;
  const selCour = document.getElementById('l_cour_id');
  selCour.innerHTML = '<option value="">— Aucune —</option>' + coursFiltrees.map(c=>`<option value="${c.id}" ${loc.cour_id===c.id?'selected':''}>${c.nom}</option>`).join('');
  refreshTypesByCour();
}
function refreshTypesByCour(){
  const courId = document.getElementById('l_cour_id').value;
  const types = window._typesCache||[];
  const loc = window._editingLocal||{};
  const typesFiltres = courId ? types.filter(t=>t.cour_id===courId) : types;
  const selType = document.getElementById('l_type_maison_id');
  selType.innerHTML = typesFiltres.map(t=>`<option value="${t.id}" ${loc.type_maison_id===t.id?'selected':''}>${t.nom}</option>`).join('')
    || '<option value="">— Aucun type pour cette cour —</option>';
}
function toggleLocalLocataire(){
  const type = document.getElementById('l_type_local').value;
  const locataires = (window._locatairesCache||[]).filter(l=>l.type_local===type);
  const sel = document.getElementById('l_locataire_id');
  const loc = window._editingLocal||{};
  sel.innerHTML = `<option value="">— Vacant / non attribué —</option>` + locataires.map(l=>{
    const nom = type==='habitation'?l.h_nom_prenom:l.c_nom_entreprise;
    return `<option value="${l.id}" ${loc.locataire_id===l.id?'selected':''}>${nom}</option>`;
  }).join('');
  sel.onchange = ()=>showAutoFields(type);
  showAutoFields(type);
}
function showAutoFields(type){
  const id = document.getElementById('l_locataire_id').value;
  const l = (window._locatairesCache||[]).find(x=>x.id===id);
  const box = document.getElementById('l_auto_fields');
  if(!l){ box.innerHTML=''; return; }
  if(type==='habitation'){
    box.innerHTML = `Né(e) le ${fmtDate(l.h_date_naissance)} à ${l.h_lieu_naissance||'—'} · Pièce: ${l.h_type_piece||'—'} ${l.h_numero_piece||''} · Profession: ${l.h_profession||'—'} · Tél: ${l.h_telephone||'—'} · Email: ${l.h_email||'—'}`;
  } else {
    box.innerHTML = `${l.c_forme_juridique||'—'} · RCCM: ${l.c_rccm||'—'} · Siège: ${l.c_adresse_siege||'—'} · Email: ${l.c_email_entreprise||'—'} · Contact: ${l.c_contact_entreprise||'—'} · Représentant: ${l.c_qualite_representant||''} ${l.c_rep_nom_prenom||''}`;
  }
}
async function saveLocal(id){
  const rec = {
    adresse_id: document.getElementById('l_adresse_id').value||null,
    cour_id: document.getElementById('l_cour_id').value||null,
    type_local: document.getElementById('l_type_local').value,
    type_maison_id: document.getElementById('l_type_maison_id').value||null,
    prix: parseFloat(document.getElementById('l_prix').value||0),
    caution: parseFloat(document.getElementById('l_caution').value||0),
    locataire_id: document.getElementById('l_locataire_id').value||null
  };
  if(!rec.prix){ toast("Le prix du local est requis."); return; }
  let error;
  if(id){ ({error} = await sb.from('locaux').update(rec).eq('id',id)); }
  else { ({error} = await sb.from('locaux').insert(rec)); }
  if(error){ toast("Erreur: "+error.message); return; }
  closeModal(); toast("Local enregistré ✅"); renderLocaux();
}
function editLocal(id){ const l=(window._locauxCache||[]).find(x=>x.id===id); openLocalForm(l); }
async function deleteLocal(id){
  if(!confirm("Confirmez-vous la suppression de ce local ?")) return;
  const {error} = await sb.from('locaux').delete().eq('id',id);
  if(error){ toast("Erreur: "+error.message); return; }
  toast("Local supprimé"); renderLocaux();
}

function filterHistorique(tableId, courSelId, typeSelId){
  const table = document.getElementById(tableId);
  if(!table) return;
  const cour = document.getElementById(courSelId)?.value||'';
  const type = document.getElementById(typeSelId)?.value||'';
  table.querySelectorAll('tbody tr').forEach(tr=>{
    const okCour = !cour || tr.dataset.cour===cour;
    const okType = !type || tr.dataset.type===type;
    tr.style.display = (okCour && okType) ? '' : 'none';
  });
}
async function calculerArriere(localId){
  const [{data}, {data:dataArr}] = await Promise.all([
    sb.from('paiements').select('reste, montant_arriere_paye').eq('locaux_id', localId),
    sb.from('paiements_arrieres').select('montant_paye').eq('locaux_id', localId)
  ]);
  if(!data) return 0;
  const totalReste = data.reduce((s,p)=>s+Number(p.reste||0),0);
  const totalArrierePaye = data.reduce((s,p)=>s+Number(p.montant_arriere_paye||0),0) + (dataArr||[]).reduce((s,p)=>s+Number(p.montant_paye||0),0);
  return Math.max(0, totalReste - totalArrierePaye);
}
async function onPaiementLocalChange(){
  const locId = document.getElementById('p_local_select').value;
  const loc = (window._locauxCache||[]).find(l=>l.id===locId);
  document.getElementById('p_montant_du').value = loc?loc.prix:'';
  const box = document.getElementById('p_arriere_box');
  if(!loc){
    document.getElementById('p_arriere').value = '';
    box.style.display='none';
    calcReste();
    return;
  }
  document.getElementById('p_arriere').value = '...';
  const arriere = await calculerArriere(loc.id);
  document.getElementById('p_arriere').value = arriere;
  if(arriere>0){
    box.style.display='block';
    box.innerHTML = `⚠️ Ce locataire a un arriéré de <b>${fmtMoney(arriere)}</b> issu des mois précédents non payés.`;
  } else {
    box.style.display='none';
  }
  calcReste();
}
function calcReste(){
  const du = parseFloat(document.getElementById('p_montant_du').value||0);
  const recu = parseFloat(document.getElementById('p_montant_recu').value||0);
  document.getElementById('p_reste').value = Math.max(0, du-recu);
}
async function enregistrerPaiement(){
  const locId = document.getElementById('p_local_select').value;
  if(!locId){ toast("Veuillez sélectionner un locataire."); return; }
  const loc = (window._locauxCache||[]).find(l=>l.id===locId);
  const montantDu = parseFloat(document.getElementById('p_montant_du').value||0);
  const recu = parseFloat(document.getElementById('p_montant_recu').value||0);
  const reste = Math.max(0, montantDu-recu);
  const rec = {
    locataire_id: loc.locataire_id, locaux_id: loc.id,
    date_paiement: document.getElementById('p_date').value,
    montant_total_du: montantDu,
    avance: parseFloat(document.getElementById('p_avance').value||0),
    reste: reste, montant_recu: recu,
    montant_arriere_paye: 0,
    total_recu: recu,
    mois_concerne: document.getElementById('p_mois').value,
    nom_payeur: document.getElementById('p_nom_payeur').value,
    mode_paiement: document.getElementById('p_mode_paiement').value,
    statut: reste<=0 ? 'complet' : 'partiel'
  };
  const {error} = await sb.from('paiements').insert(rec);
  if(error){ toast("Erreur: "+error.message); return; }
  toast(reste<=0 ? "Paiement complet enregistré ✅ (quittance disponible)" : "Paiement partiel enregistré ⚠️ (reçu disponible)");
  renderPaiements();
}

async function genererDocument(paiementId, type){
  const p = (window._paiementsCache||[]).find(x=>x.id===paiementId);
  if(!p) return;
  if(type==='quittance' && p.statut!=='complet'){ toast("La quittance n'est disponible qu'après paiement complet."); return; }
  const locat = (window._locatairesCache||[]).find(l=>l.id===p.locataire_id);
  const nomLocataire = locat ? (locat.type_local==='habitation'?locat.h_nom_prenom:locat.c_nom_entreprise) : '—';

  const proprioNom = PARAMS.mode==='entreprise' ? PARAMS.ent_nom : PARAMS.proprio_nom;
  const proprioContact = PARAMS.mode==='entreprise' ? PARAMS.ent_contact : PARAMS.proprio_contact;

  const qrData = JSON.stringify({
    proprietaire: proprioNom, locataire: nomLocataire, numero_recu: p.numero_recu,
    date: p.date_paiement, heure: p.heure_paiement, payeur: p.nom_payeur
  });

  const qrDiv = document.createElement('div');
  qrDiv.style.display='none';
  document.body.appendChild(qrDiv);
  new QRCode(qrDiv, {text:qrData, width:150, height:150});
  await new Promise(r=>setTimeout(r,250));
  const qrImg = qrDiv.querySelector('img') || qrDiv.querySelector('canvas');
  const qrDataUrl = qrImg.tagName==='CANVAS' ? qrImg.toDataURL() : qrImg.src;
  qrDiv.remove();

  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFont('times','normal');
  doc.setTextColor(0,0,0);

  // Bloc N° de reçu (haut gauche) et QR code (haut droite)
  doc.setFont('times','bold');
  doc.setFontSize(12);
  doc.setTextColor(128,0,32);
  doc.text(`N° de reçu : ${p.numero_recu||'—'}`, 14, 18);
  doc.setTextColor(0,0,0);
  doc.addImage(qrDataUrl,'PNG',168,10,24,24);

  // Bloc propriétaire (sous le N° de reçu)
  doc.setFontSize(12);
  doc.text(proprioNom||'Nom du propriétaire', 14, 28);
  doc.setFont('times','normal');
  doc.text('Contact : '+(proprioContact||'—'), 14, 34);

  // Titre centré
  doc.setFont('times','bold');
  doc.setFontSize(16);
  doc.text(type==='quittance'?'QUITTANCE DE PAIEMENT DE LOYER':'REÇU DE PAIEMENT DE LOYER', 105, 55, {align:'center'});

  doc.setFont('times','normal');
  doc.setFontSize(12);
  let y = 72;
  const champ = (label, val)=>{ doc.text(`${label} : ${val||'…………………………'}`, 14, y); y += 10; };
  champ('Mois de', fmtDate(p.mois_concerne));
  champ('Nom du locataire', nomLocataire);
  champ('Montant payé (en FCFA)', fmtMoney(p.montant_recu));
  champ('Montant du loyer à payer (FCFA)', fmtMoney(p.montant_total_du));
  champ('Arriéré (en FCFA)', p.montant_arriere_paye ? fmtMoney(p.montant_arriere_paye) : fmtMoney(0));
  champ('Reste à payer (en FCFA)', fmtMoney(p.reste));

  y += 4;
  doc.text('Mode de paiement :', 14, y);
  y += 8;
  const modes = ['Mobile Money','Virement','Chèque','Espèce'];
  modes.forEach(m=>{
    const coche = p.mode_paiement===m ? 'X' : ' ';
    doc.rect(18, y-4, 5, 5);
    doc.setFont('times','bold');
    doc.text(coche, 19.3, y);
    doc.setFont('times','normal');
    doc.text(m, 28, y);
    y += 8;
  });

  y += 6;
  doc.text(`Fait à Abidjan le : ${fmtDate(p.date_paiement)}`, 14, y);

  y += 26;
  doc.setFont('times','bold');
  doc.setTextColor(0,0,0);
  const sigLabel = 'Signature du propriétaire de maison';
  const sigNom = `(${proprioNom||'—'})`;
  doc.text(sigLabel, 148, y, {align:'center'});
  doc.line(148-40, y+2, 148+40, y+2);
  doc.text(sigNom, 148, y+8, {align:'center'});

  doc.setFont('times','normal');
  doc.setFontSize(8);
  doc.setTextColor(150,150,150);
  doc.text('Document généré automatiquement par GJM Immobilier.', 14, 287);

  const fname = `${type}_${nomLocataire}_${p.mois_concerne}.pdf`.replace(/\s+/g,'_');
  doc.save(fname);
  toast((type==='quittance'?'Quittance':'Reçu')+" téléchargée ✅");
}

  const paye = parseFloat(document.getElementById('epa_paye').value||0);
  const reste = Math.max(0, avant-paye);
  const rec = {
    date_paiement: document.getElementById('epa_date').value,
    mois_concerne: document.getElementById('epa_mois').value||null,
    montant_arriere_avant: avant,
    montant_paye: paye,
    reste_arriere: reste,
    statut: reste<=0 ? 'total' : 'partiel'
  };
  const {error} = await sb.from('paiements_arrieres').update(rec).eq('id',id);
  if(error){ toast("Erreur: "+error.message); return; }
  closeModal();
  toast("Paiement d'arriéré modifié ✅ (comptabilité mise à jour)");
  renderPaiements();
}
async function deletePaiementArriere(id){
  if(!confirm("Confirmez-vous la suppression de ce paiement d'arriéré ? La comptabilité sera automatiquement mise à jour.")) return;
  const {error} = await sb.from('paiements_arrieres').delete().eq('id',id);
  if(error){ toast("Erreur: "+error.message); return; }
  toast("Paiement d'arriéré supprimé ✅ (comptabilité mise à jour)");
  renderPaiements();
}

async function getSituationArrieres(){
  const [{data:paiements},{data:paiementsArrieres},{data:locataires},{data:locaux},{data:cours},{data:types}] = await Promise.all([
    sb.from('paiements').select('reste,montant_arriere_paye,mois_concerne,locaux_id'),
    sb.from('paiements_arrieres').select('montant_paye,locaux_id'),
    sb.from('locataires').select('*'),
    sb.from('locaux').select('*'),
    sb.from('cours').select('*'),
    sb.from('types_maison').select('*')
  ]);
  const infoLocal = (localId)=>{
    const loc = (locaux||[]).find(x=>x.id===localId);
    const cour = loc ? (cours||[]).find(cr=>cr.id===loc.cour_id) : null;
    const typ = loc ? (types||[]).find(t=>t.id===loc.type_maison_id) : null;
    return {cour: cour?cour.nom:'', typ: typ?typ.nom:''};
  };
  const arrieresParLocal = {};
  (paiements||[]).forEach(p=>{
    if(!p.locaux_id) return;
    if(!arrieresParLocal[p.locaux_id]) arrieresParLocal[p.locaux_id] = {reste:0, arrierePaye:0, moisImpayes:[]};
    arrieresParLocal[p.locaux_id].reste += Number(p.reste||0);
    arrieresParLocal[p.locaux_id].arrierePaye += Number(p.montant_arriere_paye||0);
    if(Number(p.reste||0) > 0 && p.mois_concerne){
      arrieresParLocal[p.locaux_id].moisImpayes.push(p.mois_concerne);
    }
  });
  (paiementsArrieres||[]).forEach(pa=>{
    if(!pa.locaux_id) return;
    if(!arrieresParLocal[pa.locaux_id]) arrieresParLocal[pa.locaux_id] = {reste:0, arrierePaye:0, moisImpayes:[]};
    arrieresParLocal[pa.locaux_id].arrierePaye += Number(pa.montant_paye||0);
  });
  return Object.keys(arrieresParLocal).map(localId=>{
    const solde = Math.max(0, arrieresParLocal[localId].reste - arrieresParLocal[localId].arrierePaye);
    const loc = (locaux||[]).find(x=>x.id===localId);
    const l = loc ? (locataires||[]).find(x=>x.id===loc.locataire_id) : null;
    const nom = l ? (l.type_local==='habitation'?l.h_nom_prenom:l.c_nom_entreprise) : '—';
    const info = infoLocal(localId);
    const moisImpayesRaw = Array.from(new Set(arrieresParLocal[localId].moisImpayes)).sort();
    return {nom, cour:info.cour, typ:info.typ, solde, moisImpayesRaw, moisImpayes: moisImpayesRaw.map(m=>fmtDate(m)), localId, prixLoyer: loc?loc.prix:0};
  }).filter(x=>x.solde>0).sort((a,b)=>b.solde-a.solde);
}

function exportTableToPDF(tableId, title){
  const table = document.getElementById(tableId);
  if(!table) return;
  const headers = Array.from(table.querySelectorAll('thead th')).map(th=>th.textContent.trim());
  const actionsIdx = headers.findIndex(h=>h==='Actions');
  const headersFiltered = headers.filter((h,i)=>i!==actionsIdx);
  const visibleRows = Array.from(table.querySelectorAll('tbody tr')).filter(tr=>tr.style.display!=='none' && !tr.querySelector('td[colspan]'));
  if(visibleRows.length===0){ toast("Aucune donnée à exporter."); return; }
  const body = visibleRows.map(tr=>Array.from(tr.children).map((td,i)=>i===actionsIdx?null:td.textContent.trim()).filter(v=>v!==null));
  const doc = creerPdfBase(title);
  doc.autoTable({
    startY: 38,
    head: [headersFiltered],
    body: body,
    headStyles: {fillColor:[22,51,122]},
    styles: {fontSize:9, cellPadding:3}
  });
  doc.save(slugify(title)+'.pdf');
  toast("Historique téléchargé ✅");
}
function toggleBox(boxId, btnId, defaultLabel){

  const visible = box.style.display!=='none';
  box.style.display = visible ? 'none' : 'block';
  btn.textContent = visible ? defaultLabel : 'Masquer';

function creerPdfBase(titre){
  const proprioNom = PARAMS && PARAMS.mode==='entreprise' ? PARAMS.ent_nom : (PARAMS?PARAMS.proprio_nom:'');
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFillColor(22,51,122);
  doc.rect(0,0,210,28,'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(16);
  doc.text(proprioNom||'GJM Immobilier', 14, 13);
  doc.setFontSize(10);
  doc.text(titre, 14, 20);
  doc.setTextColor(0,0,0);
  return doc;
}

  const totalDepenses = (depenses||[]).reduce((s,d)=>s+Number(d.montant||0),0);

async function ouvrirBilanComptable(){
  const d = await chargerBilanData();
  if(!d) return;
  const annees = Array.from(new Set(d.paiements.map(p=>p.date_paiement?p.date_paiement.slice(0,4):null).concat(d.depenses.map(dep=>dep.date_depense?dep.date_depense.slice(0,4):null)).filter(Boolean))).sort().reverse();
  const moisNoms = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
  openModal(`
    <h2>📈 Bilan comptable — GJM Immobilier</h2>
    <div class="row">
      <div class="field"><label>Année</label>
        <select id="bilan_annee" onchange="renderBilanContent()">
          <option value="">Toutes les années</option>
          ${annees.map(a=>`<option value="${a}">${a}</option>`).join('')}
        </select>
      </div>
      <div class="field"><label>Mois</label>
        <select id="bilan_mois" onchange="renderBilanContent()">
          <option value="">Tous les mois</option>
          ${moisNoms.map((m,i)=>`<option value="${String(i+1).padStart(2,'0')}">${m}</option>`).join('')}
        </select>
      </div>
    </div>
    <div id="bilanContent"></div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Fermer</button>
      <button class="btn-primary" onclick="telechargerBilanPDF()">⬇ Télécharger le bilan (PDF)</button>
    </div>
  `);
  renderBilanContent();
}

function renderBilanContent(){
  const d = window._bilanData;
  if(!d) return;
  const annee = document.getElementById('bilan_annee').value;
  const mois = document.getElementById('bilan_mois').value;

  const dansLaPeriode = (dateStr)=>{
    if(!dateStr) return false;
    if(annee && !dateStr.startsWith(annee)) return false;
    if(mois && dateStr.slice(5,7)!==mois) return false;
    return true;
  };
  const paiementsF = d.paiements.filter(p=>dansLaPeriode(p.date_paiement));
  const depensesF = d.depenses.filter(dep=>dansLaPeriode(dep.date_depense));
  const arrieresF = (d.paiementsArrieres||[]).filter(pa=>dansLaPeriode(pa.date_paiement));

  const totalRecuArrieres = arrieresF.reduce((s,pa)=>s+Number(pa.montant_paye||0),0);

  const totalDepenses = depensesF.reduce((s,dep)=>s+Number(dep.montant||0),0);

  document.getElementById('bilanContent').innerHTML = `

      <div class="stat-card" style="border-left-color:var(--navy)"><div class="label">Argent en caisse (période)</div><div class="value">${fmtMoney(caisse)}</div></div>
      <div class="stat-card" style="border-left-color:var(--red)"><div class="label">Arriérés en cours (actuel)</div><div class="value">${fmtMoney(d.totalArrieresEnCours)}</div></div>

    <p><b>Locataires enregistrés :</b> ${nbLocataires}</p>

    <div class="section-title">Revenus</div>

  window._bilanFiltre = {annee, mois, totalRecu, totalDepenses, caisse, revenusParCour, depensesParCour, periodeLabel};

async function telechargerBilanPDF(){
  const d = window._bilanData;
  const f = window._bilanFiltre;
  if(!d || !f) return;
  const proprioNom = PARAMS && PARAMS.mode==='entreprise' ? PARAMS.ent_nom : (PARAMS?PARAMS.proprio_nom:'');
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.setFillColor(22,51,122);
  doc.rect(0,0,210,28,'F');
  doc.setTextColor(255,255,255);
  doc.setFontSize(16);
  doc.text(proprioNom||'GJM Immobilier', 14, 13);
  doc.setFontSize(10);
  doc.text('Bilan comptable — '+f.periodeLabel, 14, 20);
  doc.setTextColor(0,0,0);
  let y=42;
  const line=(label,val)=>{ doc.setFontSize(11); doc.setFont(undefined,'bold'); doc.text(label,14,y); doc.setFont(undefined,'normal'); doc.text(String(val||'—'),100,y); y+=8; };
  line('Total reçu :', fmtMoney(f.totalRecu));
  line('Total dépenses :', fmtMoney(f.totalDepenses));
  line('Argent en caisse (période) :', fmtMoney(f.caisse));
  line('Arriérés en cours (actuel) :', fmtMoney(d.totalArrieresEnCours));
  line('Locataires enregistrés :', d.locataires.length);
  line('Locaux enregistrés :', d.locaux.length);
  line('Locaux occupés :', d.locaux.filter(l=>l.locataire_id).length);
  y+=4;

  doc.setFontSize(12); doc.setFont(undefined,'bold'); doc.text('Revenus par cour', 14, y); y+=4;
  doc.setFont(undefined,'normal');
  const bodyRev = Object.keys(f.revenusParCour).map(k=>[k, fmtMoney(f.revenusParCour[k])]);
  bodyRev.push(['TOTAL TOUTES LES COURS', fmtMoney(f.totalRecu)]);
  doc.autoTable({
    startY: y+2,
    head: [['Cour','Total reçu']],
    body: bodyRev,
    headStyles: {fillColor:[22,51,122]},
    styles: {fontSize:10, cellPadding:4},
    didParseCell: function(data){
      if(data.row.index === bodyRev.length-1 && data.section==='body'){
        data.cell.styles.fontStyle = 'bold';
        data.cell.styles.fillColor = [243,245,249];
      }
    }
  });
  y = doc.lastAutoTable.finalY + 10;

  if(y>230){ doc.addPage(); y=20; }
  doc.setFontSize(12); doc.setFont(undefined,'bold'); doc.text('Dépenses par cour', 14, y); y+=4;
  doc.setFont(undefined,'normal');
  const bodyDep = Object.keys(f.depensesParCour).map(k=>[k, fmtMoney(f.depensesParCour[k])]);
  bodyDep.push(['TOTAL TOUTES LES COURS', fmtMoney(f.totalDepenses)]);
  doc.autoTable({
    startY: y+2,
    head: [['Cour','Total dépensé']],
    body: bodyDep,
    headStyles: {fillColor:[192,57,43]},
    styles: {fontSize:10, cellPadding:4},
    didParseCell: function(data){
      if(data.row.index === bodyDep.length-1 && data.section==='body'){
        data.cell.styles.fontStyle = 'bold';
        data.cell.styles.fillColor = [243,245,249];
      }
    }
  });
  y = doc.lastAutoTable.finalY + 10;

  if(y>230){ doc.addPage(); y=20; }
  doc.setFontSize(12); doc.setFont(undefined,'bold'); doc.text('Locataires en arriéré', 14, y); y+=4;
  doc.setFont(undefined,'normal');
  if(d.situationArrieres.length===0){
    doc.setFontSize(10); doc.text('Aucun arriéré en cours.', 14, y+8); y+=16;
  } else {
    doc.autoTable({
      startY: y+2,
      head: [['Locataire','Cour','Arriéré']],
      body: d.situationArrieres.map(x=>[x.nom, x.cour||'—', fmtMoney(x.solde)]),
      headStyles: {fillColor:[192,57,43]},
      styles: {fontSize:10, cellPadding:4}
    });
    y = doc.lastAutoTable.finalY + 10;
  }
  doc.setFontSize(9);
  doc.setTextColor(120,120,120);
  doc.text('Document généré automatiquement par GJM Immobilier.', 14, 290);
  doc.save('bilan_comptable_'+new Date().toISOString().slice(0,10)+'.pdf');
  toast("Bilan téléchargé ✅");
}

const TABLES_SAUVEGARDE = ['utilisateurs','parametres_generales','adresses_locaux','types_maison','cours','locataires','locaux','paiements','paiements_arrieres','depenses'];

async function lancerSauvegarde(){
  const statusEl = document.getElementById('sauvegardeStatus');
  const btn = document.getElementById('btnSauvegarde');
  btn.disabled = true;
  try{
    statusEl.textContent = 'Récupération des données...';
    const zip = new JSZip();
    const tables = {};
    for(const t of TABLES_SAUVEGARDE){
      const {data, error} = await sb.from(t).select('*');
      if(error) throw new Error('Table '+t+' : '+error.message);
      tables[t] = data||[];
    }

    // Collecte de tous les fichiers (photos, pièces, logos, signatures) à inclure
    const urlSet = new Set();
    const addUrl = (u)=>{ if(u) urlSet.add(u); };
    (tables.locataires||[]).forEach(l=>{
      addUrl(l.h_piece_id_url); addUrl(l.h_photo_url); (l.h_autres_pieces_url||[]).forEach(addUrl);
      addUrl(l.c_piece_representant_url); addUrl(l.c_photo_representant_url); (l.c_autres_pieces_entreprise_url||[]).forEach(addUrl);
    });
    (tables.parametres_generales||[]).forEach(p=>{
      addUrl(p.proprio_photo_url); addUrl(p.proprio_signature_url); addUrl(p.proprio_autres_docs_url);
      addUrl(p.ent_logo_url); addUrl(p.ent_rccm_doc_url); addUrl(p.ent_autres_infos_url);
    });

    const fichiers = {};
    let i=0, total=urlSet.size;
    for(const url of urlSet){
      i++;
      statusEl.textContent = `Téléchargement des fichiers... (${i}/${total})`;
      try{
        const res = await fetch(url);
        const blob = await res.blob();
        const cleanUrl = url.split('?')[0];
        const ext = (cleanUrl.split('.').pop()||'bin').slice(0,6);
        const relPath = `fichiers/fichier_${i}.${ext}`;
        zip.file(relPath, blob);
        fichiers[url] = relPath;
      }catch(e){ console.error('Fichier non récupéré:', url, e); }
    }

    statusEl.textContent = 'Compression de l\'archive...';
    const dataJson = {version:1, date_export:new Date().toISOString(), tables, fichiers};
    zip.file('data.json', JSON.stringify(dataJson));

    const blobZip = await zip.generateAsync({type:'blob'}, (meta)=>{
      statusEl.textContent = `Compression... ${Math.round(meta.percent)}%`;
    });
    const urlZip = URL.createObjectURL(blobZip);
    const a = document.createElement('a');
    a.href = urlZip;
    a.download = `sauvegarde_gjm_immobilier_${new Date().toISOString().slice(0,10)}.zip`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    statusEl.textContent = `✅ Sauvegarde téléchargée avec succès (${total} fichier(s) inclus).`;
    toast("Sauvegarde créée ✅");
  }catch(e){
    statusEl.textContent = '';
    toast("Erreur pendant la sauvegarde : "+e.message);
  }
  btn.disabled = false;
}

async function lancerRestauration(file){
  if(!file) return;
  const statusEl = document.getElementById('sauvegardeStatus');
  if(!confirm("ATTENTION : la restauration va REMPLACER toutes les données actuelles (locataires, locaux, paiements, comptabilité, photos, documents) par celles de cette sauvegarde. Cette action est irréversible. Voulez-vous continuer ?")) {
    document.getElementById('inputRestauration').value = '';
    return;
  }
  try{
    statusEl.textContent = 'Lecture de la sauvegarde...';
    const zip = await JSZip.loadAsync(file);
    const dataFile = zip.file('data.json');
    if(!dataFile) throw new Error("Fichier de sauvegarde invalide (data.json introuvable).");
    const data = JSON.parse(await dataFile.async('string'));

    // Ré-upload de tous les fichiers et construction du mapping ancienne URL -> nouvelle URL
    const urlMapping = {};
    const entries = Object.entries(data.fichiers||{});
    let i=0;
    for(const [origUrl, relPath] of entries){
      i++;
      statusEl.textContent = `Restauration des fichiers... (${i}/${entries.length})`;
      const entry = zip.file(relPath);
      if(!entry) continue;
      const blob = await entry.async('blob');
      const filename = relPath.split('/').pop();
      const path = 'restauration/'+Date.now()+'_'+i+'_'+filename;
      const {error} = await sb.storage.from(BUCKET).upload(path, blob);
      if(!error){
        const {data:pub} = sb.storage.from(BUCKET).getPublicUrl(path);
        urlMapping[origUrl] = pub.publicUrl;
      }
    }
    const remap = (v)=> v && urlMapping[v] ? urlMapping[v] : v;
    const remapArr = (arr)=> (arr||[]).map(remap);

    const locataires = (data.tables.locataires||[]).map(l=>({
      ...l,
      h_piece_id_url: remap(l.h_piece_id_url),
      h_photo_url: remap(l.h_photo_url),
      h_autres_pieces_url: remapArr(l.h_autres_pieces_url),
      c_piece_representant_url: remap(l.c_piece_representant_url),
      c_photo_representant_url: remap(l.c_photo_representant_url),
      c_autres_pieces_entreprise_url: remapArr(l.c_autres_pieces_entreprise_url)
    }));
    const parametresGenerales = (data.tables.parametres_generales||[]).map(p=>({
      ...p,
      proprio_photo_url: remap(p.proprio_photo_url),
      proprio_signature_url: remap(p.proprio_signature_url),
      proprio_autres_docs_url: remap(p.proprio_autres_docs_url),
      ent_logo_url: remap(p.ent_logo_url),
      ent_rccm_doc_url: remap(p.ent_rccm_doc_url),
      ent_autres_infos_url: remap(p.ent_autres_infos_url)
    }));

    // Suppression des données actuelles (enfants d'abord)
    statusEl.textContent = 'Suppression des données actuelles...';
    const deleteOrder = ['paiements_arrieres','paiements','depenses','locaux','locataires','cours','types_maison','adresses_locaux','utilisateurs'];
    for(const t of deleteOrder){
      await sb.from(t).delete().not('id','is',null);
    }

    // Réinsertion (parents d'abord)
    statusEl.textContent = 'Réinsertion des données...';
    const insertOrder = ['utilisateurs','adresses_locaux','types_maison','cours'];
    for(const t of insertOrder){
      const rows = data.tables[t]||[];
      if(rows.length) { const {error} = await sb.from(t).insert(rows); if(error) console.error(t, error); }
    }
    if(locataires.length){ const {error} = await sb.from('locataires').insert(locataires); if(error) console.error('locataires', error); }
    if((data.tables.locaux||[]).length){ const {error} = await sb.from('locaux').insert(data.tables.locaux); if(error) console.error('locaux', error); }
    if((data.tables.paiements||[]).length){ const {error} = await sb.from('paiements').insert(data.tables.paiements); if(error) console.error('paiements', error); }
    if((data.tables.paiements_arrieres||[]).length){ const {error} = await sb.from('paiements_arrieres').insert(data.tables.paiements_arrieres); if(error) console.error('paiements_arrieres', error); }
    if((data.tables.depenses||[]).length){ const {error} = await sb.from('depenses').insert(data.tables.depenses); if(error) console.error('depenses', error); }

    // Mise à jour des paramètres généraux (ligne unique id=1)
    if(parametresGenerales.length){
      const p = parametresGenerales[0];
      const {id, ...rest} = p;
      await sb.from('parametres_generales').update(rest).eq('id',1);
    }

    statusEl.textContent = '✅ Restauration terminée avec succès.';
    toast("Restauration terminée ✅ — rechargement de l'application...");
    setTimeout(()=>location.reload(), 2000);
  }catch(e){
    statusEl.textContent = '';
    toast("Erreur pendant la restauration : "+e.message);
  }
  document.getElementById('inputRestauration').value = '';
}

function onDepenseCourChange(){

async function ajouterDepense(){
  const courId = document.getElementById('d_cour_id').value || null;
  const cour = courId ? (window._coursCache||[]).find(c=>c.id===courId) : null;
  const rec = {
    date_depense:document.getElementById('d_date').value,
    libelle:document.getElementById('d_libelle').value,
    montant:parseFloat(document.getElementById('d_montant').value||0),
    cour_id: courId,

  };

  if(error){ toast("Erreur: "+error.message); return; }
  toast("Dépense ajoutée"); renderComptabilite();
}

}

      <div class="section-title">Sécurité — Utilisateurs et rôles</div>
      <div class="table-wrap"><table><thead><tr><th>Nom complet</th><th>Nom d'utilisateur</th><th>Rôle</th><th>Actions</th></tr></thead>
      <tbody>${(users||[]).map(u=>`<tr><td>${u.nom}</td><td>${u.nom_utilisateur||'—'}</td><td>${u.role}</td><td>
        ${u.role!=='createur'?`<button class="btn-danger" onclick="deleteUser('${u.id}')" style="padding:5px 9px;font-size:11px;">Suppr.</button>`:'<span style="color:var(--muted)">—</span>'}
      </td></tr>`).join('')}</tbody></table></div>
      <div class="card add-user-card" style="margin-top:14px;max-width:500px;">
        <h3>Ajouter un utilisateur</h3>
        <div class="row">
          <div class="field"><label>Prénom</label><input id="u_prenom"></div>
          <div class="field"><label>Nom</label><input id="u_nom"></div>
        </div>
        <div class="row">
          <div class="field"><label>Nom d'utilisateur (pour se connecter)</label><input id="u_nom_utilisateur"></div>
          <div class="field"><label>Mot de passe</label><input id="u_pass"></div>
        </div>
        <div class="field"><label>Rôle</label>
          <select id="u_role"><option value="administrateur">Administrateur</option><option value="tresorier">Trésorier</option><option value="secretaire">Secrétaire</option></select>
        </div>
        <button class="btn-primary" onclick="addUser()">Ajouter</button>
      </div>`;
  }

  let periodeHtml='';
  if(canPeriode){
    periodeHtml = `
      <div class="section-title">Période d'utilisation de l'application</div>
      <div class="row">
        <div class="field"><label>Date de début</label><input type="date" id="opt_periode_debut" value="${params?.periode_debut||''}"></div>
        <div class="field"><label>Date de fin</label><input type="date" id="opt_periode_fin" value="${params?.periode_fin||''}"></div>
      </div>
      <button class="btn-secondary" onclick="savePeriode()">Enregistrer la période</button>`;
  }

  let sauvegardeHtml = '';
  if(isAdmin){
    sauvegardeHtml = `
      <div class="section-title">Sauvegarde et restauration</div>
      <div class="card">
        <p style="color:var(--muted);font-size:13.5px;">Créez une sauvegarde complète de l'application : toutes les données (locataires, locaux, paiements, comptabilité, options) <b>ainsi que toutes les photos et tous les documents</b> des dossiers locataires. Le fichier téléchargé est une archive .zip que vous pouvez conserver en lieu sûr (clé USB, Google Drive, etc.).</p>
        <div class="row" style="margin-top:14px;">
          <button class="btn-primary" onclick="lancerSauvegarde()" id="btnSauvegarde">💾 Créer une sauvegarde complète</button>
          <button class="btn-secondary" onclick="document.getElementById('inputRestauration').click()">♻️ Restaurer une sauvegarde</button>
          <input type="file" id="inputRestauration" accept=".zip" style="display:none;" onchange="lancerRestauration(this.files[0])">
        </div>
        <p id="sauvegardeStatus" style="color:var(--muted);font-size:13px;margin-top:10px;"></p>
        <div class="alert-box" style="margin-top:10px;">⚠️ La restauration remplace <b>toutes</b> les données actuelles par celles de la sauvegarde choisie. Cette action est irréversible — assurez-vous de faire une sauvegarde récente avant de restaurer.</div>
      </div>`;
  }

  document.getElementById('content').innerHTML = `
    <div class="options-page">
    <div class="tabs">
      <button class="tab-btn ${!params||params.mode!=='entreprise'?'active':''}" onclick="switchOwnerMode('proprietaire')">Propriétaire</button>
      <button class="tab-btn ${params&&params.mode==='entreprise'?'active':''}" onclick="switchOwnerMode('entreprise')">Entreprise</button>
    </div>
    <div id="ownerForm"></div>
    ${periodeHtml}
    ${usersHtml}
    ${sauvegardeHtml}
    </div>
  `;
  renderOwnerForm(params?.mode||'proprietaire');
}
function switchOwnerMode(mode){
  PARAMS = PARAMS||{};
  PARAMS.mode = mode;
  renderOwnerForm(mode);
  document.querySelectorAll('.tab-btn').forEach((b,i)=>b.classList.toggle('active', (i===0&&mode==='proprietaire')||(i===1&&mode==='entreprise')));
}
function renderOwnerForm(mode){
  const p = PARAMS||{};
  const box = document.getElementById('ownerForm');
  if(mode==='proprietaire'){
    box.innerHTML = `
      <div class="section-title">Information sur le propriétaire</div>
      <div class="row">
        <div class="field"><label>Nom et prénom</label><input id="o_nom" value="${p.proprio_nom||''}"></div>
        <div class="field"><label>Contact</label><input id="o_contact" value="${p.proprio_contact||''}"></div>
      </div>
      <div class="row">
        <div class="field"><label>Adresse e-mail</label><input id="o_email" value="${p.proprio_email||''}"></div>
        <div class="field"><label>Quartier</label><input id="o_quartier" value="${p.proprio_quartier||''}"></div>
      </div>
      <div class="section-title">Pièces jointes</div>
      <div class="row">
        <div class="field"><label>Photo du propriétaire</label><input type="file" id="o_photo">${p.proprio_photo_url?`<a href="${p.proprio_photo_url}" target="_blank">Voir</a>`:''}</div>
        <div class="field"><label>Signature</label><input type="file" id="o_signature">${p.proprio_signature_url?`<a href="${p.proprio_signature_url}" target="_blank">Voir</a>`:''}</div>
        <div class="field"><label>Autres documents</label><input type="file" id="o_autres">${p.proprio_autres_docs_url?`<a href="${p.proprio_autres_docs_url}" target="_blank">Voir</a>`:''}</div>
      </div>
      <button class="btn-primary" onclick="saveOwner('proprietaire')">Enregistrer</button>`;
  } else {
    box.innerHTML = `
      <div class="section-title">Information sur l'entreprise</div>
      <div class="row">
        <div class="field"><label>Nom de l'entreprise</label><input id="o_ent_nom" value="${p.ent_nom||''}"></div>
        <div class="field"><label>RCCM</label><input id="o_ent_rccm" value="${p.ent_rccm||''}"></div>
      </div>
      <div class="row">
        <div class="field"><label>Siège social</label><input id="o_ent_siege" value="${p.ent_siege_social||''}"></div>
        <div class="field"><label>Adresse e-mail</label><input id="o_ent_email" value="${p.ent_email||''}"></div>
        <div class="field"><label>Contact</label><input id="o_ent_contact" value="${p.ent_contact||''}"></div>
      </div>
      <div class="section-title">Pièces jointes</div>
      <div class="row">
        <div class="field"><label>RCCM (document)</label><input type="file" id="o_ent_rccm_doc">${p.ent_rccm_doc_url?`<a href="${p.ent_rccm_doc_url}" target="_blank">Voir</a>`:''}</div>
        <div class="field"><label>Autres infos</label><input type="file" id="o_ent_autres">${p.ent_autres_infos_url?`<a href="${p.ent_autres_infos_url}" target="_blank">Voir</a>`:''}</div>
        <div class="field"><label>Logo de l'entreprise (page d'accueil)</label><input type="file" id="o_ent_logo">${p.ent_logo_url?`<img class="file-thumb" src="${p.ent_logo_url}">`:''}</div>
      </div>
      <button class="btn-primary" onclick="saveOwner('entreprise')">Enregistrer</button>`;
  }
}
async function saveOwner(mode){
  const rec = {mode};
  if(mode==='proprietaire'){
    rec.proprio_nom = document.getElementById('o_nom').value;
    rec.proprio_contact = document.getElementById('o_contact').value;
    rec.proprio_email = document.getElementById('o_email').value;
    rec.proprio_quartier = document.getElementById('o_quartier').value;
    const photo = document.getElementById('o_photo').files[0];
    const sig = document.getElementById('o_signature').files[0];
    const autres = document.getElementById('o_autres').files[0];
    if(photo) rec.proprio_photo_url = await uploadFile(photo,'proprietaire');
    if(sig) rec.proprio_signature_url = await uploadFile(sig,'proprietaire');
    if(autres) rec.proprio_autres_docs_url = await uploadFile(autres,'proprietaire');
  } else {
    rec.ent_nom = document.getElementById('o_ent_nom').value;
    rec.ent_rccm = document.getElementById('o_ent_rccm').value;
    rec.ent_siege_social = document.getElementById('o_ent_siege').value;
    rec.ent_email = document.getElementById('o_ent_email').value;
    rec.ent_contact = document.getElementById('o_ent_contact').value;
    const rccmDoc = document.getElementById('o_ent_rccm_doc').files[0];
    const autres = document.getElementById('o_ent_autres').files[0];
    const logo = document.getElementById('o_ent_logo').files[0];
    if(rccmDoc) rec.ent_rccm_doc_url = await uploadFile(rccmDoc,'entreprise');
    if(autres) rec.ent_autres_infos_url = await uploadFile(autres,'entreprise');
    if(logo) rec.ent_logo_url = await uploadFile(logo,'entreprise');
  }
  const {error} = await sb.from('parametres_generales').update(rec).eq('id',1);
  if(error){ toast("Erreur: "+error.message); return; }
  toast("Informations enregistrées ✅");
  renderOptions();
  applyBranding();
}
async function savePeriode(){
  const rec = {periode_debut: document.getElementById('opt_periode_debut').value||null, periode_fin: document.getElementById('opt_periode_fin').value||null};
  const {error} = await sb.from('parametres_generales').update(rec).eq('id',1);
  if(error){ toast("Erreur: "+error.message); return; }
  toast("Période d'utilisation enregistrée ✅");
}
async function addUser(){
  const prenom = document.getElementById('u_prenom').value.trim();
  const nomFamille = document.getElementById('u_nom').value.trim();
  const nomUtilisateur = document.getElementById('u_nom_utilisateur').value.trim();
  const pass = document.getElementById('u_pass').value.trim();
  const role = document.getElementById('u_role').value;
  if(!prenom||!nomFamille||!nomUtilisateur||!pass){ toast("Veuillez remplir le prénom, le nom, le nom d'utilisateur et le mot de passe."); return; }
  const nom = `${prenom} ${nomFamille}`;
  const {error} = await sb.from('utilisateurs').insert({nom,nom_utilisateur:nomUtilisateur,mot_de_passe:pass,role});
  if(error){ toast("Erreur: "+error.message); return; }
  toast("Utilisateur ajouté ✅"); renderOptions();
}
async function deleteUser(id){
  if(!confirm("Supprimer cet utilisateur ?")) return;
  await sb.from('utilisateurs').delete().eq('id',id);
  toast("Utilisateur supprimé"); renderOptions();
}

</script>
</body>
</html>
